version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - PROXY_POOL_URL=http://proxy-pool:5010
      - PROXY_ROTATION_STRATEGY=round-robin
      - PROXY_MAX_RETRIES=3
      - SELENIUM_DRIVER=chrome
      - SELENIUM_HEADLESS=true
    depends_on:
      - ollama
      - redis
      - proxy-pool
      - selenium
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: "2gb"
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_SESSION_TIMEOUT=300
    ports:
      - "4444:4444"

  proxy-pool:
    image: jhao104/proxy_pool:latest
    ports:
      - "5010:5010"
    environment:
      - DB_CONN=redis://redis:6379/0
    depends_on:
      - redis

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  ollama_data:
